name: Music Japan | Remote-Free Continuity Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '19 */6 * * *'
  push:
    paths:
      - '.github/workflows/remote-free-continuity.yml'
      - 'cloud/continuity_audit.py'
      - 'cloud/test_continuity_audit.py'

permissions:
  contents: read

concurrency:
  group: mj-remote-free-continuity
  cancel-in-progress: false

jobs:
  public-cloud-continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout public synthetic-only repo without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Offline contract tests (no remote PC and no network)
        run: python3 -m unittest discover -s cloud -p 'test_continuity_audit.py' -v
      - name: Observe public GitHub cloud runners only
        run: |
          python3 cloud/continuity_audit.py --output "$RUNNER_TEMP/continuity-receipt.json"
          echo '### Music Japan RDC-free public cloud proof' >> "$GITHUB_STEP_SUMMARY"
          echo 'GitHub-hosted runner performed bounded public API checks without Remote Desktop Commander, company credentials, or AI API credits' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/continuity-receipt.json" >> "$GITHUB_STEP_SUMMARY"
